name: 데이터 수집 배치

# 서빙 서버를 24시간 켜두지 않고도 데이터를 최신으로 유지하기 위한 워크플로.
# 크롤링 + 감성분석 + 임베딩을 러너에서 돌리고 결과만 DB에 남긴다.
# (러너는 작업이 끝나면 사라지므로 비용이 들지 않는다.)

on:
  schedule:
    # UTC 18:00 = KST 03:00. 장 마감 후 하루치를 모아서 수집한다.
    - cron: "0 18 * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행

concurrency:
  # 이전 실행이 아직 돌고 있으면 겹쳐 돌지 않게 한다 (DB 중복 쓰기 방지)
  group: crawl-batch
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-batch.txt

      - name: 의존성 설치
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # torch는 CPU 휠로 먼저 설치한다. 그냥 두면 CUDA 빌드를 받아서
          # 내려받는 용량이 몇 배로 늘어나고 러너 시간이 길어진다.
          pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-batch.txt

      - name: 감성분석 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ vars.SENTIMENT_MODEL_FALLBACK || 'snunlp/KR-FinBert-SC' }}

      - name: 배치 실행
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 파인튜닝 모델을 HuggingFace에 올렸다면 저장소 변수에 repo id를 넣는다.
          # 설정하지 않으면 베이스 모델(snunlp/KR-FinBert-SC)로 동작한다.
          # 빈 문자열이 그대로 들어가면 모델 경로가 깨지므로 기본값을 명시한다.
          SENTIMENT_MODEL_FALLBACK: ${{ vars.SENTIMENT_MODEL_FALLBACK || 'snunlp/KR-FinBert-SC' }}
          # 러너에서는 스케줄러/기동 크롤링이 필요 없다 (이 스크립트가 직접 돈다)
          ENABLE_SCHEDULER: "false"
          ENABLE_STARTUP_CRAWL: "false"
        run: python scripts/run_batch.py
